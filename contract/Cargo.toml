[package]
name = "archivepass"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["receiver"]
resolver = "2"

[dependencies]
near-sdk = { version = "=5.30.0", default-features = false }
near-contract-standards = "=5.30.0"
base64 = "0.22"

[dev-dependencies]
near-sdk = { version = "=5.30.0", default-features = false, features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
